<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>TG Sync Hub</title>
<style>
:root{--bg:#070d18;--side:#0a1220;--card:#101a2c;--line:#24344c;--txt:#e8eef8;--muted:#8ea0b8;--acc:#5b9dff;--ok:#3dd68c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#13233c 0%,var(--bg) 55%);color:var(--txt);font-family:Microsoft YaHei,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:rgba(10,18,32,.92);padding:18px 14px;border-right:1px solid var(--line)}
aside>div{margin-bottom:16px;letter-spacing:.3px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
nav button:hover{background:#132033;color:#fff}
nav button.on{background:linear-gradient(90deg,#1b3a66,#173054);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
main{padding:28px 32px}
h1{margin:0 0 16px;font-size:26px;font-weight:800}
.panel,#v{background:rgba(16,26,44,.92);border:1px solid var(--line);border-radius:16px;padding:16px 18px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#v div{margin:6px 0}
.hint{color:var(--muted);font-size:12px}
input,select{width:100%;max-width:420px;margin:6px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0b1524;color:var(--txt)}
button{margin-left:6px;padding:6px 10px;border:0;border-radius:8px;background:#3a5f99;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
button[data-adel],button[data-del],button[data-k]{background:#8a3a4c}

.chip{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;border:1px solid #334866;background:#1a2740;color:#c5d2e6}
.chip-on,.chip.chip-on{background:#1f8a5a !important;color:#d9ffe8 !important;border-color:#3dd68c !important;box-shadow:0 0 0 2px #3dd68c;background:#1f8a5a !important;color:#d9ffe8 !important;border-color:#3dd68c !important;box-shadow:0 0 0 2px #3dd68c}

.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#0d1a2c;border:1px solid #24344c;border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:6px}
.stat .hint{margin:0}

.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;align-items:stretch}
.mpane{border:1px solid #2a3d58;border-radius:12px;padding:12px;min-height:220px;background:#0b1626}
.mpane b{display:block;margin-bottom:8px}

.mpane #m1,.mpane #m2,.mpane #m3,.mpane #m4{height:360px;overflow-y:auto;overflow-x:hidden;line-height:1.45;word-break:break-all}
.mgrid{align-items:start}
</style></head><body>
<div class="app"><aside>
<div style="font-weight:800">TG Sync Hub<div class="hint">真实路径 · live</div></div>
<nav id="nav">
<button class="on" data-t="ov">总览</button>
<button data-t="lis">监听账号</button>
<button data-t="acc">镜像账号</button>
<button data-t="bind">克隆绑定</button>
<button data-t="msg">消息映射</button><button data-t="bot">消息映射机器人</button>
<button data-t="api">API 池</button>
<button data-t="ip">IP 线路池</button>
</nav></aside>
<main><h1 id="t">总览</h1><div id="v" class="panel">点左侧菜单切换</div></main></div>
<script>
var tab="ov";
function draw(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab);});
  var T={ov:"总览",lis:"监听账号",acc:"镜像账号",bind:"克隆绑定",msg:"消息映射",bot:"消息映射机器人",api:"API 池",ip:"IP 线路池"};
  var title=document.getElementById("t"); if(title) title.textContent=T[tab]||tab;
  var box=document.getElementById("v"); if(!box) return;
  if(tab==="ov"){
    box.textContent="加载总览...";
    fetch("/api/overview").then(function(r){return r.json();}).then(function(o){
      box.innerHTML="账号 "+(o.accounts||0)+"  API "+(o.api_free||0)+"/"+(o.api_total||0)+"  IP "+(o.ip_free||0)+"/"+(o.ip_total||0)+"  配对 "+(o.bound_pairs||0)+"<div class='hint' id='wr'>worker 查询中</div><button id='wstart'>启动工作</button> <button id='wstop'>停止工作</button><div id='otasks'>任务加载中</div>";
      fetch("/api/worker/status").then(function(r){return r.json();}).then(function(w){document.getElementById("wr").textContent="worker："+(w.state||w.status||"?");}).catch(function(){document.getElementById("wr").textContent="worker：未知";});
      document.getElementById("wstart").onclick=function(){ Promise.all([fetch("/api/worker/start",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}), fetch("/api/identities").then(function(r){return r.json();}).then(function(d){ d=Array.isArray(d)?d:[]; return Promise.all(d.map(function(x){return fetch("/api/identities/"+x.id+"/start",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});})); })]).then(function(){alert("已启动");tab="ov";draw();}); };
      document.getElementById("wstop").onclick=function(){ Promise.all([fetch("/api/worker/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}), fetch("/api/identities").then(function(r){return r.json();}).then(function(d){ d=Array.isArray(d)?d:[]; return Promise.all(d.map(function(x){return fetch("/api/identities/"+x.id+"/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});})); })]).then(function(){alert("已停止");tab="ov";draw();}); };
      fetch("/api/identities").then(function(r){return r.json();}).then(function(d){
        d=Array.isArray(d)?d:[];
        var el=document.getElementById("otasks"), h="", i;
        for(i=0;i<d.length;i++){
          var x=d[i];
          h+="<div>任务#"+(x.tag||x.id)+" "+(x.source_group||"")+" -> "+(x.dest_group||"")+" 状态"+(x.enabled===0?"停":"开")+" <button data-run='"+x.id+"'>启动</button> <button data-halt='"+x.id+"'>停止</button></div>";
        }
        el.innerHTML=h||"暂无任务";
        el.onclick=function(e){
          var a=e.target.closest("button[data-run]");
          if(a){ Promise.all([fetch("/api/identities/"+a.dataset.run+"/start",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}),fetch("/api/worker/start",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})]).then(function(){alert("已启动");draw();}); return; }
          var b=e.target.closest("button[data-halt]");
          if(b){ Promise.all([fetch("/api/identities/"+b.dataset.halt+"/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}),fetch("/api/worker/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})]).then(function(){alert("已停止");draw();}); }
        };
      });
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
  if(tab==="lis"||tab==="acc"){
    var mon=tab==="lis";
    box.innerHTML=(mon?"<div>显示名</div><input id='n1'><div>手机号</div><input id='p1'><button id='add'>添加监听号</button>":"<div>显示名</div><input id='n1'><div>手机号</div><input id='p1'><button id='add'>添加账号</button>")+"<div id='alist'>加载中</div>";
    document.getElementById("add").onclick=function(){
      fetch("/api/accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({display_name:document.getElementById("n1").value,phone:document.getElementById("p1").value,role:mon?"MONITOR":"MIRROR",auto_api:true})}).then(function(){draw();});
    };
    fetch("/api/accounts").then(function(r){return r.json();}).then(function(d){
      d=Array.isArray(d)?d:[];
      var list=[],i;
      for(i=0;i<d.length;i++){
        var rr=String(d[i].role||"").toUpperCase();
        var ism=rr==="MONITOR"||rr==="LISTEN";
        if(mon?ism:!ism) list.push(d[i]);
      }
      var h="",el=document.getElementById("alist");
      for(i=0;i<list.length;i++){
        var x=list[i], on=String(x.status||"").toUpperCase()==="ONLINE";
        h+="<div># "+(i+1)+" "+(x.phone||"")+" "+(on?"ONLINE":(x.status||"OFFLINE"));
        if(!on) h+=" <button data-code='"+x.id+"'>发送验证码</button> <input id='vc"+x.id+"' placeholder='验证码'> <input id='pw"+x.id+"' placeholder='二步密码'> <button data-in='"+x.id+"'>登录</button>";
        h+=" <input id='nt"+x.id+"' placeholder='备注' value='"+(x.note||"").replace(/'/g,"")+"'> <button data-note='"+x.id+"'>保存备注</button> <button data-adel='"+x.id+"'>删除</button></div>";
      }
      el.innerHTML=h||"暂无";
      el.onclick=function(e){
        var b=e.target.closest("button"); if(!b)return;
        if(b.dataset.code){fetch("/api/accounts/"+b.dataset.code+"/send_code",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){return r.text();}).then(alert);return;}
        if(b.dataset.in){var id=b.dataset.in;fetch("/api/accounts/"+id+"/sign_in",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:(document.getElementById("vc"+id)||{}).value||"",password:(document.getElementById("pw"+id)||{}).value||""})}).then(function(r){return r.text();}).then(function(x){alert(x);draw();});return;}
        if(b.dataset.note){var id=b.dataset.note;fetch("/api/accounts/"+id+"/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:(document.getElementById("nt"+id)||{}).value||""})}).then(function(){b.textContent="已保存";});return;}
        if(b.dataset.adel){if(!confirm("删除?"))return;fetch("/api/accounts/"+b.dataset.adel+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){draw();});}
      };
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
  if(tab==="api"){
    fetch("/api/apis").then(function(r){return r.json();}).then(function(d){
      d=Array.isArray(d)?d:[]; var h="";
      for(var i=0;i<d.length;i++) h+="<div># "+(i+1)+" "+(d[i].api_id||"")+" "+(d[i].account_id||"空闲")+" <button data-k='apis' data-id='"+d[i].id+"'>删除</button></div>";
      box.innerHTML=h||"池为空";
      box.onclick=function(e){var b=e.target.closest("button[data-k]");if(!b)return;if(!confirm("删除?"))return;fetch("/api/apis/"+b.dataset.id+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){draw();});};
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
  if(tab==="ip"){
    box.innerHTML="<textarea id='ipbat' placeholder='每行一条 IP:端口' style='width:100%;height:80px'></textarea><button id='ipgo'>一键批量加入</button><div id='iplist'>加载中</div><div id='ipacc'></div>";
    document.getElementById("ipgo").onclick=function(){
      fetch("/api/ips/batch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:document.getElementById("ipbat").value})}).then(function(r){return r.text();}).then(function(x){alert(x);tab="ip";draw();});
    };
    Promise.all([fetch("/api/ips").then(function(r){return r.json();}),fetch("/api/accounts").then(function(r){return r.json();}),fetch("/api/ipbinds").then(function(r){return r.json();}).catch(function(){return [];})]).then(function(x){
      var ips=Array.isArray(x[0])?x[0]:[], acc=Array.isArray(x[1])?x[1]:[], binds=Array.isArray(x[2])?x[2]:[];
      var curIp=ips.length?ips[0].id:0, picked={};
      function fill(){ picked={}; for(var k=0;k<binds.length;k++){ if(String(binds[k].ip_id)===String(curIp)) picked[String(binds[k].account_id)]=true; } }
      fill();
      var el=document.getElementById("iplist"), chips=document.getElementById("ipacc"), h="", i;
      for(i=0;i<ips.length;i++) h+="<div data-view='"+ips[i].id+"'># "+(i+1)+" "+(ips[i].host||"")+":"+(ips[i].port||"")+(String(ips[i].id)===String(curIp)?" 当前":"")+" <button data-use='"+ips[i].id+"'>选这条</button> <button data-ipid='"+ips[i].id+"'>删除</button></div>";
      el.innerHTML=h||"池为空";
      function paint(){
        var mons=[],mirs=[],n;
        for(n=0;n<acc.length;n++){ var r=String(acc[n].role||"").toUpperCase(); if(r==="MONITOR"||r==="LISTEN") mons.push(acc[n]); else mirs.push(acc[n]); }
        function g(list,title){
          var s="<div class='hint'>"+title+"</div>", j;
          for(j=0;j<list.length;j++){ var a=list[j], on=!!picked[String(a.id)]; s+="<button type='button' data-chip='"+a.id+"' style='margin:4px;padding:6px 12px;border-radius:999px;border:0;background:"+(on?"#1f8a5a":"#1a2740")+";color:"+(on?"#d9ffe8":"#c5d2e6")+"'># "+(j+1)+" "+(a.phone||"")+"</button> "; }
          return s;
        }
        chips.innerHTML=g(mons,"监听账号")+g(mirs,"镜像账号");
      }
      paint();
      chips.onclick=function(e){ var c=e.target.closest("button[data-chip]"); if(!c)return; picked[String(c.dataset.chip)]=!picked[String(c.dataset.chip)]; paint(); };
      el.onclick=function(e){
        var v=e.target.closest("[data-view]");
        if(v && !e.target.closest("button")){ curIp=v.dataset.view; fill(); paint(); return; }
        var u=e.target.closest("button[data-use]");
        if(u){
          curIp=u.dataset.use;
          var ids=Object.keys(picked).filter(function(k){return picked[k];});
          if(!ids.length){ fill(); paint(); return; }
          fetch("/api/ips/"+curIp+"/bind",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_ids:ids})}).then(function(r){return r.json();}).then(function(){
            binds=binds.filter(function(b){return String(b.ip_id)!==String(curIp);});
            for(var k=0;k<ids.length;k++) binds.push({ip_id:curIp,account_id:Number(ids[k])});
            fill(); paint(); alert("已保存");
          });
          return;
        }
        var d=e.target.closest("button[data-ipid]");
        if(d){ if(!confirm("删除?"))return; fetch("/api/ips/"+d.dataset.ipid+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){tab="ip";draw();}); }
      };
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
if(tab==="bind"){
    box.innerHTML="<div class='hint'>监听最多3个，镜像最多10个。源用户系统自动采，不用手填。</div><div id='mchips'></div><div>源群</div><input id='sc' placeholder='https://t.me/群 或 @群'><div>目标群</div><input id='dc' placeholder='https://t.me/群 或 @群'><button id='bsv'>保存 #1</button><div id='pend' class='hint'></div><div id='blist'>加载绑定...</div>";
    var pickM={}, pickI={};
    fetch("/api/accounts").then(function(r){return r.json();}).then(function(d){
      var all=Array.isArray(d)?d:[], mons=[], mirs=[], n;
      for(n=0;n<all.length;n++){ var r=String(all[n].role||"").toUpperCase(); if(r==="MONITOR"||r==="LISTEN") mons.push(all[n]); else mirs.push(all[n]); }
      function chips(list, map, max, title){
        var h="<div class='hint'>"+title+"</div>", i;
        for(i=0;i<list.length;i++){ var a=list[i], on=!!map[String(a.id)]; h+="<button type='button' class='chip"+(on?" chip-on":"")+"' data-kind='"+title+"' data-id='"+a.id+"' style='"+(on?"background:#1f8a5a;color:#d9ffe8":"")+"'># "+(i+1)+" "+(a.phone||"")+"</button> "; }
        return h;
      }
      function paint(){ document.getElementById("mchips").innerHTML=chips(mons,pickM,3,"监听")+chips(mirs,pickI,10,"镜像"); }
      paint();
      document.getElementById("mchips").onclick=function(e){
        var b=e.target.closest("button[data-id]"); if(!b)return;
        var map=b.dataset.kind==="监听"?pickM:pickI, max=b.dataset.kind==="监听"?3:10, id=String(b.dataset.id);
        if(map[id]) map[id]=false;
        else { var c=0,k; for(k in map) if(map[k]) c++; if(c>=max){alert("最多"+max+"个");return;} map[id]=true; }
        paint();
      };
      document.getElementById("bsv").onclick=function(){
        var ms=[],is=[],k;
        for(k in pickM) if(pickM[k]) ms.push(Number(k));
        for(k in pickI) if(pickI[k]) is.push(Number(k));
        fetch("/api/identities",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({monitor_account:ms[0]||0,monitor2:ms[1]||0,monitor3:ms[2]||0,mirrors:is,source_group:document.getElementById("sc").value,real_user:"AUTO",mirror_account:is[0]||0,dest_group:document.getElementById("dc").value,tag:"1"})}).then(function(){tab="bind";draw();});
      };
    });
    fetch("/api/pending").then(function(r){return r.json();}).then(function(d){
      var el=document.getElementById("pend"); if(!el)return;
      if(!Array.isArray(d)||!d.length){el.textContent="待绑定真人：暂无（worker 停止时为空）";return;}
      el.textContent="系统已采到："+d.map(function(x){return x.username||"";}).join(" ");
    }).catch(function(){});
    fetch("/api/identities").then(function(r){return r.json();}).then(function(d){
      var el=document.getElementById("blist"); if(!el)return;
      d=Array.isArray(d)?d:[];
      var h="",i;
      for(i=0;i<d.length;i++){
        var x=d[i];
        h+="<div>#"+(x.tag||x.id)+" 监听"+[x.monitor_account,x.monitor2,x.monitor3].filter(Boolean).join("/")+" "+(x.source_group||"")+" "+(x.real_user||"AUTO")+" 镜像"+(x.mirror_account||"")+" "+(x.dest_group||"")+" 状态"+(x.enabled===0?"停":"开")+" <input id='bn"+x.id+"' placeholder='备注' value='"+(x.note||"").replace(/'/g,"")+"'> <button data-bnote='"+x.id+"'>保存备注</button> <button data-stop='"+x.id+"'>停止这条</button> <button data-del='"+x.id+"'>删除</button></div>";
      }
      el.innerHTML=h||"无绑定";
      el.onclick=function(e){
        var n=e.target.closest("button[data-bnote]");
        if(n){ fetch("/api/identities/"+n.dataset.bnote+"/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:(document.getElementById("bn"+n.dataset.bnote)||{}).value||""})}).then(function(){n.textContent="已保存";}); return; }
        var s=e.target.closest("button[data-stop]");
        if(s){ fetch("/api/identities/"+s.dataset.stop+"/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){return r.text();}).then(function(x){alert(x);tab="bind";draw();}); return; }
        var b=e.target.closest("button[data-del]");
        if(b){ if(!confirm("删除?"))return; fetch("/api/identities/"+b.dataset.del+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){tab="bind";draw();}); }
      };
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
if(tab==="bot"){
    box.innerHTML="<div class='hint'>用真实号登录。回复优先用消息映射记录。指定目标群后，从水军里点选，系统自动派2-3个进群活跃，其余轮班。</div><div>显示名</div><input id='n1'><div>手机号</div><input id='p1'><button id='add'>添加机器人号</button><div id='alist'>加载中</div><hr><div>目标指定群</div><input id='bg' placeholder='https://t.me/群 或 @群'><div class='hint'>点号牌变绿=加入本群轮班池，保存时系统自动取前2-3个为当前活跃</div><div id='bpick'>加载水军</div><button id='bsave'>保存群+轮班</button><div id='bjobs'>任务加载中</div><div id='brain' class='hint'></div>";
    var picked={};
    document.getElementById("add").onclick=function(){
      fetch("/api/accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({display_name:document.getElementById("n1").value,phone:document.getElementById("p1").value,role:"BOT",auto_api:true})}).then(function(){tab="bot";draw();});
    };
    function paintPick(list){
      var h="", i;
      for(i=0;i<list.length;i++){
        var x=list[i], on=!!picked[String(x.id)];
        h+="<button type='button' data-chip='"+x.id+"' style='margin:4px;padding:6px 12px;border-radius:999px;border:0;background:"+(on?"#1f8a5a":"#1a2740")+";color:"+(on?"#d9ffe8":"#c5d2e6")+"'># "+(i+1)+" "+(x.phone||x.display_name||"")+"</button> ";
      }
      document.getElementById("bpick").innerHTML=h||"暂无水军号";
    }
    Promise.all([
      fetch("/api/accounts").then(function(r){return r.json();}),
      fetch("/api/botjobs").then(function(r){return r.json();}).catch(function(){return [];}),
      fetch("/api/msgmap").then(function(r){return r.json();}).catch(function(){return [];}), fetch("/api/fwds").then(function(r){return r.json();}).catch(function(){return [];})
    ]).then(function(x){
      var acc=Array.isArray(x[0])?x[0]:[], jobs=Array.isArray(x[1])?x[1]:[], maps=Array.isArray(x[2])?x[2]:[];
      var bots=[], pool=[], i;
      for(i=0;i<acc.length;i++){
        var rr=String(acc[i].role||"").toUpperCase();
        if(rr==="BOT"){ bots.push(acc[i]); pool.push(acc[i]); }
      }
      var h="", el=document.getElementById("alist");
      for(i=0;i<bots.length;i++){
        var x=bots[i], on=String(x.status||"").toUpperCase()==="ONLINE";
        h+="<div># "+(i+1)+" "+(x.phone||"")+" "+(on?"ONLINE":(x.status||"OFFLINE"));
        if(!on) h+=" <button data-code='"+x.id+"'>发送验证码</button> <input id='vc"+x.id+"' placeholder='验证码'> <input id='pw"+x.id+"' placeholder='二步密码'> <button data-in='"+x.id+"'>登录</button>";
        h+=" <input id='nt"+x.id+"' placeholder='备注' value='"+(x.note||"").replace(/'/g,"")+"'> <button data-note='"+x.id+"'>保存备注</button> <button data-adel='"+x.id+"'>删除</button></div>";
      }
      el.innerHTML=h||"暂无机器人号";
      el.onclick=function(e){
        var b=e.target.closest("button"); if(!b)return;
        if(b.dataset.code){fetch("/api/accounts/"+b.dataset.code+"/send_code",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){return r.text();}).then(alert);return;}
        if(b.dataset.in){var id=b.dataset.in;fetch("/api/accounts/"+id+"/sign_in",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:(document.getElementById("vc"+id)||{}).value||"",password:(document.getElementById("pw"+id)||{}).value||""})}).then(function(r){return r.text();}).then(function(x){alert(x);draw();});return;}
        if(b.dataset.note){var id=b.dataset.note;fetch("/api/accounts/"+id+"/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:(document.getElementById("nt"+id)||{}).value||""})}).then(function(){b.textContent="已保存";});return;}
        if(b.dataset.adel){if(!confirm("删除?"))return;fetch("/api/accounts/"+b.dataset.adel+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){draw();});}
      };
      paintPick(pool);
      document.getElementById("bpick").onclick=function(e){
        var c=e.target.closest("button[data-chip]"); if(!c)return;
        picked[String(c.dataset.chip)]=!picked[String(c.dataset.chip)];
        paintPick(pool);
      };
      document.getElementById("bsave").onclick=function(){
        var ids=Object.keys(picked).filter(function(k){return picked[k];});
        if(!document.getElementById("bg").value){alert("先填目标群");return;}
        if(ids.length<2){alert("至少点绿2个水军号");return;}
        fetch("/api/botjobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dest_group:document.getElementById("bg").value,account_ids:ids})}).then(function(r){return r.text();}).then(function(x){alert(x);tab="bot";draw();});
      };
      var jh="", k;
      for(k=0;k<jobs.length;k++){
        var j=jobs[k];
        jh+="<div>任务#"+j.id+" 目标 "+(j.dest_group||"")+" 轮班池 "+(j.account_ids||"")+" 当前活跃 "+(j.active_ids||"")+" <button data-jdel='"+j.id+"'>删除</button></div>";
      }
      document.getElementById("bjobs").innerHTML=jh||"暂无指定群任务";
      document.getElementById("bjobs").onclick=function(e){
        var b=e.target.closest("button[data-jdel]"); if(!b)return;
        if(!confirm("删除任务?"))return;
        fetch("/api/botjobs/"+b.dataset.jdel+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(){tab="bot";draw();});
      };
      document.getElementById("brain").textContent="记录大脑条数 "+maps.length+"（回复优先用这些句子）";
    }).catch(function(e){box.textContent=String(e);});
    return;
  }
if(tab==="msg"){
    box.innerHTML="<div class='mgrid'><div class='mpane'><b>窗口1 源群监听</b><div id='m1' class='hint'>加载中</div></div><div class='mpane'><b>窗口2 采集 #1 #2 #3</b><div id='m2' class='hint'>加载中</div></div><div class='mpane'><b>窗口3 编号→镜像</b><div id='m3' class='hint'>加载中</div></div><div class='mpane'><b>窗口4 机器人回复</b><div id='m4' class='hint'>加载中</div></div></div>";
    function loadMsg(){
      Promise.all([
        fetch("/api/identities").then(function(r){return r.json();}).catch(function(){return [];}),
        fetch("/api/msgmap").then(function(r){return r.json();}).catch(function(){return [];}),
        fetch("/api/fwds").then(function(r){return r.json();}).catch(function(){return [];}),
        fetch("/api/accounts").then(function(r){return r.json();}).catch(function(){return [];})
      ]).then(function(x){
        if(tab!=="msg") return;
        var job=(Array.isArray(x[0])?x[0]:[])[0]||{};
        var maps=Array.isArray(x[1])?x[1]:[];
        var fwds=Array.isArray(x[2])?x[2]:[];
        var acc=Array.isArray(x[3])?x[3]:[];
        var all=maps.filter(function(m){var s=String(m.text||"").toLowerCase();return s.indexOf("kicked")<0&&s.indexOf("banned")<0;}).slice(0,12);
        var a=document.getElementById("m1");
        if(a) a.innerHTML=(job.source_group||"")+"<br>"+all.map(function(m){return (m.ts||"")+" "+(m.src_user||"")+" "+(m.text||"");}).join("<br>");
        var seen={}, users=[], i;
        for(i=0;i<all.length;i++){
          var u=String(all[i].src_user||""), tl=String(all[i].text||"").toLowerCase();
          if(!u||seen[u]) continue;
          if(u.toLowerCase().indexOf("bot")>=0) continue;
          seen[u]=1; users.push({username:u});
          if(users.length>=3) break;
        }
        var h2="", k;
        for(k=0;k<3;k++){
          var name=users[k]?users[k].username:"";
          var lines=all.filter(function(m){return name && String(m.src_user||"")===name;}).slice(0,5);
          h2+="<b># "+(k+1)+" "+(name||"待采集")+"</b><br>"+(lines.map(function(m){return (m.ts||"")+" "+(m.text||"");}).join("<br>")||"暂无此用户句子")+"<br><br>";
        }
        var b=document.getElementById("m2"); if(b) b.innerHTML=h2;
        var realFwd=fwds.filter(function(f){var m=String(f.msg||""); return m.indexOf("转发")>=0 && m.indexOf("msg=")<0;});
        var fwdTxt=realFwd.map(function(f){return (f.ts||"")+" "+String(f.msg||"").replace(/^转发\s*/,"");}).join("<br>");
        if(!fwdTxt) fwdTxt=all.slice(0,10).map(function(m){return (m.ts||"")+" "+(m.text||"");}).join("<br>");
        var c=document.getElementById("m3"); if(c) c.innerHTML="<div class='hint'>镜像发到目标群的正文</div>"+(fwdTxt||"暂无");
        var bots=[], n;
        for(n=0;n<acc.length;n++){
          if(String(acc[n].role||"").toUpperCase()==="BOT" && (acc[n].id==27||acc[n].id==30||String(acc[n].id)==="27"||String(acc[n].id)==="30")) bots.push(acc[n]);
        }
        var h4=bots.length?("只用 "+bots.map(function(z){return z.phone||z.id;}).join(" / ")+"<br>"):"无27/30";
        var qi;
        for(qi=0;qi<Math.min(all.length,6);qi++){
          var src=all[qi], bot=bots[qi%Math.max(bots.length,1)]||{};
          h4+="水军 "+(bot.phone||"")+"<br>源: "+(src.text||"")+"<br>回: "+(src.text||"")+"<br><br>";
        }
        var d=document.getElementById("m4"); if(d) d.innerHTML=h4;
      }).catch(function(e){box.textContent=String(e);});
    }
    loadMsg();
    var iv=setInterval(function(){ if(tab!=="msg"){clearInterval(iv);return;} loadMsg(); },5000);
    return;
  }
box.textContent=T[tab]||tab;
}
document.getElementById("nav").onclick=function(e){
  var b=e.target.closest("button[data-t]"); if(!b)return;
  tab=b.dataset.t; draw();
};
draw();
</script></body></html>
